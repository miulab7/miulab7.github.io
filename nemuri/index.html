  <h1>眠りの周波数ラボ</h1>
  <p class="lead">眠る前に流す音楽と、星空の映像を届けるYouTubeチャンネルです。</p>

  <h2>チャンネル</h2>
  <p>
    睡眠用のヒーリング音楽（432Hz・528Hzなど）と星空の映像を、毎晩公開しています。
    短い動画では、星の点で描いた錯視や、月の雑学を出しています。
  </p>
  <p><a href="https://www.youtube.com/@nemuri-freq-lab">YouTubeで見る（@nemuri-freq-lab）</a></p>

  <h2>ytpub について</h2>
  <p>
    ytpub は、このチャンネルの運営者が、自分のチャンネルへ動画を投稿・予約し、
    再生数などの統計を読むために使っている個人用のツールです。
    運営者以外の方が使うことはありません。
  </p>
